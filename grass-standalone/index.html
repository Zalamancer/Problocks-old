<!DOCTYPE html>
<html>
  <head>
    <title>WebGL Grass - Standalone Demo</title>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { cursor: grab; display: block; }
      canvas:active { cursor: grabbing; }
    </style>
  </head>
  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.138.1/build/three.module.js",
          "three/examples/jsm/controls/OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.138.1/examples/jsm/controls/OrbitControls.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls';

      // ── Shaders (exact from src/shaders.js) ──────────────────────

      const vertexShader = `
        uniform float uTime;

        varying vec3 vPosition;
        varying vec2 vUv;
        varying vec3 vNormal;

        float wave(float waveSize, float tipDistance, float centerDistance) {
          bool isTip = (gl_VertexID + 1) % 5 == 0;
          float waveDistance = isTip ? tipDistance : centerDistance;
          return sin((uTime / 500.0) + waveSize) * waveDistance;
        }

        void main() {
          vPosition = position;
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);

          if (vPosition.y < 0.0) {
            vPosition.y = 0.0;
          } else {
            vPosition.x += wave(uv.x * 10.0, 0.3, 0.1);
          }

          gl_Position = projectionMatrix * modelViewMatrix * vec4(vPosition, 1.0);
        }
      `;

      const fragmentShader = `
        uniform sampler2D uCloud;

        varying vec3 vPosition;
        varying vec2 vUv;
        varying vec3 vNormal;

        vec3 green = vec3(0.2, 0.6, 0.3);

        void main() {
          vec3 color = mix(green * 0.7, green, vPosition.y);
          color = mix(color, texture2D(uCloud, vUv).rgb, 0.4);

          float lighting = normalize(dot(vNormal, vec3(10.0)));
          gl_FragColor = vec4(color + lighting * 0.03, 1.0);
        }
      `;

      // ── Blade geometry (exact from src/Grass.js) ─────────────────

      const BLADE_WIDTH = 0.1;
      const BLADE_HEIGHT = 0.8;
      const BLADE_HEIGHT_VARIATION = 0.6;
      const BLADE_VERTEX_COUNT = 5;
      const BLADE_TIP_OFFSET = 0.1;

      function interpolate(val, oldMin, oldMax, newMin, newMax) {
        return ((val - oldMin) * (newMax - newMin)) / (oldMax - oldMin) + newMin;
      }

      function computeBlade(center, index) {
        const height = BLADE_HEIGHT + Math.random() * BLADE_HEIGHT_VARIATION;
        const vIndex = index * BLADE_VERTEX_COUNT;

        const yaw = Math.random() * Math.PI * 2;
        const yawVec = [Math.sin(yaw), 0, -Math.cos(yaw)];
        const bend = Math.random() * Math.PI * 2;
        const bendVec = [Math.sin(bend), 0, -Math.cos(bend)];

        const bl = yawVec.map((n, i) => n * (BLADE_WIDTH / 2) * 1 + center[i]);
        const br = yawVec.map((n, i) => n * (BLADE_WIDTH / 2) * -1 + center[i]);
        const tl = yawVec.map((n, i) => n * (BLADE_WIDTH / 4) * 1 + center[i]);
        const tr = yawVec.map((n, i) => n * (BLADE_WIDTH / 4) * -1 + center[i]);
        const tc = bendVec.map((n, i) => n * BLADE_TIP_OFFSET + center[i]);

        tl[1] += height / 2;
        tr[1] += height / 2;
        tc[1] += height;

        return {
          positions: [...bl, ...br, ...tr, ...tl, ...tc],
          indices: [
            vIndex, vIndex + 1, vIndex + 2,
            vIndex + 2, vIndex + 4, vIndex + 3,
            vIndex + 3, vIndex, vIndex + 2
          ]
        };
      }

      // ── Setup (exact from src/index.js + src/Grass.js) ───────────

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight);
      camera.position.set(-7, 3, 7);
      camera.lookAt(0, 0, 0);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enablePan = false;
      controls.maxPolarAngle = Math.PI / 2.2;
      controls.maxDistance = 15;

      const scene = new THREE.Scene();

      // ── Generate grass geometry ──────────────────────────────────

      const size = 30;
      const count = 100000;

      const positions = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i < count; i++) {
        const surfaceMin = (size / 2) * -1;
        const surfaceMax = size / 2;
        const radius = (size / 2) * Math.random();
        const theta = Math.random() * 2 * Math.PI;

        const x = radius * Math.cos(theta);
        const y = radius * Math.sin(theta);

        uvs.push(
          ...Array.from({ length: BLADE_VERTEX_COUNT }).flatMap(() => [
            interpolate(x, surfaceMin, surfaceMax, 0, 1),
            interpolate(y, surfaceMin, surfaceMax, 0, 1)
          ])
        );

        const blade = computeBlade([x, 0, y], i);
        positions.push(...blade.positions);
        indices.push(...blade.indices);
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
      geom.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs), 2));
      geom.setIndex(indices);
      geom.computeVertexNormals();

      // Cloud texture — generate procedural since we don't have cloud.jpg
      const cloudCanvas = document.createElement('canvas');
      cloudCanvas.width = 256;
      cloudCanvas.height = 256;
      const ctx = cloudCanvas.getContext('2d');
      for (let py = 0; py < 256; py++) {
        for (let px = 0; px < 256; px++) {
          const v = Math.floor((Math.sin(px * 0.05) * Math.cos(py * 0.05) * 0.5 + 0.5) * 200 + Math.random() * 55);
          ctx.fillStyle = `rgb(${v},${v},${v})`;
          ctx.fillRect(px, py, 1, 1);
        }
      }
      const cloudTexture = new THREE.CanvasTexture(cloudCanvas);
      cloudTexture.wrapS = cloudTexture.wrapT = THREE.RepeatWrapping;

      const material = new THREE.ShaderMaterial({
        uniforms: {
          uCloud: { value: cloudTexture },
          uTime: { value: 0 }
        },
        side: THREE.DoubleSide,
        vertexShader,
        fragmentShader
      });

      const grassMesh = new THREE.Mesh(geom, material);
      scene.add(grassMesh);

      // Floor
      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(15, 8).rotateX(Math.PI / 2),
        material
      );
      floor.position.y = -Number.EPSILON;
      grassMesh.add(floor);

      // ── Animate ──────────────────────────────────────────────────

      renderer.setAnimationLoop((time) => {
        material.uniforms.uTime.value = time;
        controls.update();
        renderer.render(scene, camera);
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
