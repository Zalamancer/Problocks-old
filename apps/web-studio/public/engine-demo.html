// TAB 8: AI BEHAVIOR
// ============================================================
function initAI() {
  const W = 720, H = 520;
  const canvas = createCanvas(W, H);
  canvasArea.appendChild(canvas);
  fitCanvas(canvas);
  const ctx = canvas.getContext('2d');

  const npcs = [];
  let playerX = W/2, playerY = H/2;
  let waypointMode = false, currentWaypoints = [];
  const WALL_PAD = 20;

  controlsDiv.innerHTML = `
    <button class="btn" id="aiPatrol">Add Patrol</button>
    <button class="btn secondary" id="aiGuard">Add Guard</button>
    <button class="btn secondary" id="aiWander">Add Wanderer</button>
    <button class="btn secondary" id="aiClear">Clear All</button>
    <span style="font-size:11px;color:#71717a;margin-left:8px">Red = Player (follows mouse). Green = Patrol, Blue = Guard, Yellow = Wanderer</span>
    <span class="status" id="aiStatus"></span>
  `;

  const sE = id => document.getElementById(id);

  sE('aiPatrol').onclick = () => {
    if (waypointMode) return;
    waypointMode = true;
    currentWaypoints = [];
    sE('aiStatus').textContent = 'Click 2-5 waypoints, then press Enter or double-click last';
  };

  sE('aiGuard').onclick = () => {
    npcs.push({
      type: 'guard', x: 100 + Math.random()*(W-200), y: 100 + Math.random()*(H-200),
      postX: 0, postY: 0, speed: 100, state: 'idle', color: '#3b82f6', detectRange: 150, chaseRange: 200
    });
    const n = npcs[npcs.length-1];
    n.postX = n.x; n.postY = n.y;
  };

  sE('aiWander').onclick = () => {
    const cx = 100 + Math.random()*(W-200), cy = 100 + Math.random()*(H-200);
    npcs.push({
      type: 'wanderer', x: cx, y: cy, speed: 50, state: 'wandering', color: '#eab308',
      wanderCenterX: cx, wanderCenterY: cy, wanderRadius: 120, targetX: cx, targetY: cy, waitTimer: 0
    });
  };

  sE('aiClear').onclick = () => { npcs.length = 0; };

  canvas.onmousemove = (e) => {
    const rect = canvas.getBoundingClientRect();
    playerX = (e.clientX - rect.left) * (W/rect.width);
    playerY = (e.clientY - rect.top) * (H/rect.height);
  };

  canvas.onclick = (e) => {
    if (!waypointMode) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W/rect.width);
    const y = (e.clientY - rect.top) * (H/rect.height);
    currentWaypoints.push({x, y});
    if (currentWaypoints.length >= 5) finishPatrol();
  };

  canvas.ondblclick = () => { if (waypointMode && currentWaypoints.length >= 2) finishPatrol(); };

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && waypointMode && currentWaypoints.length >= 2) finishPatrol();
    if (e.key === 'Escape' && waypointMode) { waypointMode = false; currentWaypoints = []; sE('aiStatus').textContent = ''; }
  });

  function finishPatrol() {
    const wps = [...currentWaypoints];
    npcs.push({
      type: 'patrol', x: wps[0].x, y: wps[0].y, speed: 80, state: 'patrolling',
      color: '#22c55e', waypoints: wps, waypointIdx: 0, waitTimer: 0
    });
    waypointMode = false; currentWaypoints = [];
    sE('aiStatus').textContent = 'Patrol added with ' + wps.length + ' waypoints';
  }

  function dist(x1, y1, x2, y2) { return Math.sqrt((x2-x1)**2+(y2-y1)**2); }

  function moveToward(npc, tx, ty, dt) {
    const d = dist(npc.x, npc.y, tx, ty);
    if (d < 2) return true;
    const step = Math.min(npc.speed * dt, d);
    npc.x += (tx - npc.x) / d * step;
    npc.y += (ty - npc.y) / d * step;
    // Clamp to bounds
    npc.x = clamp(npc.x, WALL_PAD, W - WALL_PAD);
    npc.y = clamp(npc.y, WALL_PAD, H - WALL_PAD);
    return false;
  }

  let lastT = performance.now();
  function update() {
    const now = performance.now(), dt = Math.min((now - lastT)/1000, 0.05);
    lastT = now;

    for (const npc of npcs) {
      const dToPlayer = dist(npc.x, npc.y, playerX, playerY);

      if (npc.type === 'patrol') {
        if (npc.state === 'waiting') {
          npc.waitTimer -= dt;
          if (npc.waitTimer <= 0) {
            npc.waypointIdx = (npc.waypointIdx + 1) % npc.waypoints.length;
            npc.state = 'patrolling';
          }
        } else {
          const wp = npc.waypoints[npc.waypointIdx];
          if (moveToward(npc, wp.x, wp.y, dt)) {
            npc.state = 'waiting';
            npc.waitTimer = 0.8;
          }
        }
      }

      if (npc.type === 'guard') {
        if (dToPlayer < npc.detectRange && npc.state !== 'chasing') {
          npc.state = 'chasing';
        }
        if (npc.state === 'chasing') {
          if (dToPlayer > npc.chaseRange) {
            npc.state = 'returning';
          } else {
            moveToward(npc, playerX, playerY, dt);
          }
        } else if (npc.state === 'returning') {
          if (moveToward(npc, npc.postX, npc.postY, dt)) {
            npc.state = 'idle';
          }
        } else {
          npc.state = 'idle';
          if (dToPlayer < npc.detectRange) npc.state = 'chasing';
        }
      }

      if (npc.type === 'wanderer') {
        if (npc.state === 'waiting') {
          npc.waitTimer -= dt;
          if (npc.waitTimer <= 0) {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.random() * npc.wanderRadius;
            npc.targetX = clamp(npc.wanderCenterX + Math.cos(angle)*r, WALL_PAD, W-WALL_PAD);
            npc.targetY = clamp(npc.wanderCenterY + Math.sin(angle)*r, WALL_PAD, H-WALL_PAD);
            npc.state = 'wandering';
          }
        } else {
          if (moveToward(npc, npc.targetX, npc.targetY, dt)) {
            npc.state = 'waiting';
            npc.waitTimer = 1 + Math.random() * 2;
          }
        }
      }
    }

    // Draw
    ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, W, H);

    // Room walls
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.strokeRect(WALL_PAD, WALL_PAD, W-WALL_PAD*2, H-WALL_PAD*2);

    // Floor tiles
    ctx.fillStyle = '#121218';
    for (let y = WALL_PAD; y < H-WALL_PAD; y += 40) for (let x = WALL_PAD; x < W-WALL_PAD; x += 40) {
      ctx.fillStyle = ((Math.floor(x/40)+Math.floor(y/40))%2===0) ? '#121218' : '#141420';
      ctx.fillRect(x, y, 40, 40);
    }

    // Draw patrol waypoints being set
    if (waypointMode && currentWaypoints.length > 0) {
      ctx.strokeStyle = '#22c55e55';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(currentWaypoints[0].x, currentWaypoints[0].y);
      for (let i = 1; i < currentWaypoints.length; i++) ctx.lineTo(currentWaypoints[i].x, currentWaypoints[i].y);
      ctx.stroke();
      ctx.setLineDash([]);
      for (const wp of currentWaypoints) {
        ctx.fillStyle = '#22c55e88';
        ctx.beginPath(); ctx.arc(wp.x, wp.y, 6, 0, Math.PI*2); ctx.fill();
      }
    }

    // Draw NPC patrol paths
    for (const npc of npcs) {
      if (npc.type === 'patrol' && npc.waypoints) {
        ctx.strokeStyle = npc.color + '33';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        for (let i = 0; i < npc.waypoints.length; i++) {
          const wp = npc.waypoints[i];
          if (i === 0) ctx.moveTo(wp.x, wp.y); else ctx.lineTo(wp.x, wp.y);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.setLineDash([]);
        for (const wp of npc.waypoints) {
          ctx.fillStyle = npc.color + '44';
          ctx.beginPath(); ctx.arc(wp.x, wp.y, 4, 0, Math.PI*2); ctx.fill();
        }
      }

      if (npc.type === 'guard') {
        // Detection range
        ctx.strokeStyle = npc.state === 'chasing' ? '#ef444433' : '#3b82f622';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.arc(npc.postX, npc.postY, npc.detectRange, 0, Math.PI*2); ctx.stroke();
        ctx.setLineDash([]);
        // Post marker
        ctx.fillStyle = '#3b82f633';
        ctx.beginPath(); ctx.arc(npc.postX, npc.postY, 6, 0, Math.PI*2); ctx.fill();
      }
    }

    // Draw NPCs
    for (const npc of npcs) {
      ctx.fillStyle = npc.color;
      ctx.beginPath(); ctx.arc(npc.x, npc.y, 12, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff3';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(npc.x, npc.y, 12, 0, Math.PI*2); ctx.stroke();
      // Eyes
      const angle = Math.atan2(
        (npc.type === 'guard' && npc.state === 'chasing') ? playerY - npc.y : (npc.targetX || npc.x) - npc.y,
        (npc.type === 'guard' && npc.state === 'chasing') ? playerX - npc.x : (npc.targetX || npc.x) - npc.x
      );
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(npc.x + Math.cos(angle)*4, npc.y + Math.sin(angle)*4, 2.5, 0, Math.PI*2); ctx.fill();
      // State label
      ctx.fillStyle = '#fff';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(npc.state, npc.x, npc.y - 18);
    }

    // Draw player
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(playerX, playerY, 14, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff5';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(playerX, playerY, 14, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('P', playerX, playerY + 3.5);

    sE('aiStatus').textContent = `NPCs: ${npcs.length}`;

    animFrame = requestAnimationFrame(update);
  }
  update();
  activeCleanup = () => { cancelAnimationFrame(animFrame); animFrame = null; };
}

// ============================================================
// TAB 9: AUDIO
// ============================================================
function initAudio() {
  const W = 720, H = 520;
  const canvas = createCanvas(W, H);
  canvasArea.appendChild(canvas);
  fitCanvas(canvas);
  const ctx = canvas.getContext('2d');

  let audioCtx = null;
  let masterGain = null, sfxGain = null, musicGain = null;
  let sourceX = W/2 + 150, sourceY = H/2 - 80;
  let draggingSource = false;
  let activeTone = null;
  let masterVol = 0.5, sfxVol = 0.7, musicVol = 0.5;

  function ensureAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain(); masterGain.gain.value = masterVol;
    sfxGain = audioCtx.createGain(); sfxGain.gain.value = sfxVol;
    musicGain = audioCtx.createGain(); musicGain.gain.value = musicVol;
    sfxGain.connect(masterGain);
    musicGain.connect(masterGain);
    masterGain.connect(audioCtx.destination);
  }

  const notes = [
    { name: 'C', freq: 261.63, color: '#ef4444' },
    { name: 'D', freq: 293.66, color: '#f97316' },
    { name: 'E', freq: 329.63, color: '#eab308' },
    { name: 'F', freq: 349.23, color: '#22c55e' },
    { name: 'G', freq: 392.00, color: '#3b82f6' },
    { name: 'A', freq: 440.00, color: '#8b5cf6' },
    { name: 'B', freq: 493.88, color: '#ec4899' }
  ];

  controlsDiv.innerHTML = `
    <span style="color:#3b82f6;font-size:12px;font-weight:600">Tones:</span>
    ${notes.map(n => `<button class="btn secondary" data-note="${n.name}" style="background:${n.color}55;border:1px solid ${n.color}">${n.name}</button>`).join('')}
    <span style="margin-left:12px"></span>
    <label>Master <input type="range" id="aMaster" min="0" max="100" value="50"></label>
    <label>SFX <input type="range" id="aSfx" min="0" max="100" value="70"></label>
    <label>Music <input type="range" id="aMusic" min="0" max="100" value="50"></label>
    <span class="status" id="aStatus">Click a note or drag the speaker icon for spatial audio</span>
  `;

  controlsDiv.querySelectorAll('[data-note]').forEach(btn => {
    btn.onclick = () => {
      ensureAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const note = notes.find(n => n.name === btn.dataset.note);
      playTone(note.freq, 0.3);
    };
  });

  document.getElementById('aMaster').oninput = function() { masterVol = this.value/100; if (masterGain) masterGain.gain.value = masterVol; };
  document.getElementById('aSfx').oninput = function() { sfxVol = this.value/100; if (sfxGain) sfxGain.gain.value = sfxVol; };
  document.getElementById('aMusic').oninput = function() { musicVol = this.value/100; if (musicGain) musicGain.gain.value = musicVol; };

  function playTone(freq, duration) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(sfxGain);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  // Spatial audio: continuous tone from source
  let spatialOsc = null, spatialGain = null, spatialPanner = null;

  function startSpatialTone() {
    if (spatialOsc) return;
    ensureAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    spatialOsc = audioCtx.createOscillator();
    spatialGain = audioCtx.createGain();
    spatialPanner = audioCtx.createStereoPanner();
    spatialOsc.type = 'triangle';
    spatialOsc.frequency.value = 220;
    spatialGain.gain.value = 0.2;
    spatialOsc.connect(spatialGain);
    spatialGain.connect(spatialPanner);
    spatialPanner.connect(sfxGain);
    spatialOsc.start();
  }

  function stopSpatialTone() {
    if (!spatialOsc) return;
    spatialOsc.stop();
    spatialOsc = null; spatialGain = null; spatialPanner = null;
  }

  function updateSpatialPanning() {
    if (!spatialPanner) return;
    const listenerX = W/2, listenerY = H/2;
    const dx = sourceX - listenerX;
    const maxDist = 300;
    const pan = clamp(dx / maxDist, -1, 1);
    const distance = Math.sqrt((sourceX-listenerX)**2 + (sourceY-listenerY)**2);
    const attenuation = clamp(1 - distance / maxDist, 0, 1);
    spatialPanner.pan.value = pan;
    if (spatialGain) spatialGain.gain.value = 0.3 * attenuation;
  }

  canvas.onmousedown = (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W/rect.width);
    const y = (e.clientY - rect.top) * (H/rect.height);
    const dx = x - sourceX, dy = y - sourceY;
    if (dx*dx+dy*dy < 900) {
      draggingSource = true;
      startSpatialTone();
    }
  };

  canvas.onmousemove = (e) => {
    if (!draggingSource) return;
    const rect = canvas.getBoundingClientRect();
    sourceX = (e.clientX - rect.left) * (W/rect.width);
    sourceY = (e.clientY - rect.top) * (H/rect.height);
    updateSpatialPanning();
  };

  canvas.onmouseup = () => {
    if (draggingSource) { draggingSource = false; stopSpatialTone(); }
  };

  function draw() {
    ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, W, H);

    // Title area
    ctx.fillStyle = '#e4e4e7';
    ctx.font = 'bold 14px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Web Audio API Demo', W/2, 30);

    // Piano keys
    const keyW = 70, keyH = 120, startX = (W - notes.length * (keyW + 8)) / 2, startY = 50;
    for (let i = 0; i < notes.length; i++) {
      const n = notes[i];
      const kx = startX + i * (keyW + 8), ky = startY;
      // Key background
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(kx, ky, keyW, keyH);
      ctx.strokeStyle = n.color;
      ctx.lineWidth = 2;
      ctx.strokeRect(kx, ky, keyW, keyH);
      // Note name
      ctx.fillStyle = n.color;
      ctx.font = 'bold 24px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(n.name, kx + keyW/2, ky + keyH/2 + 8);
      // Frequency
      ctx.fillStyle = '#71717a';
      ctx.font = '10px monospace';
      ctx.fillText(n.freq.toFixed(0) + 'Hz', kx + keyW/2, ky + keyH - 10);
    }

    // Spatial audio area
    const spY = 210;
    ctx.fillStyle = '#e4e4e7';
    ctx.font = 'bold 12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Spatial Audio - Drag the speaker', W/2, spY);

    // Background area
    ctx.fillStyle = '#111118';
    ctx.fillRect(60, spY + 10, W - 120, 270);
    ctx.strokeStyle = '#1e293b';
    ctx.strokeRect(60, spY + 10, W - 120, 270);

    // Listener (center)
    const lx = W/2, ly = spY + 145;
    // Range circles
    for (let r = 1; r <= 3; r++) {
      ctx.strokeStyle = `rgba(59,130,246,${0.15 - r*0.04})`;
      ctx.lineWidth = 1;
      ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.arc(lx, ly, r * 80, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
    }

    // Listener icon
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath(); ctx.arc(lx, ly, 15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px monospace';
    ctx.fillText('EAR', lx, ly + 4);

    // Panning line
    const distance = Math.sqrt((sourceX-lx)**2 + (sourceY-ly)**2);
    const pan = clamp((sourceX-lx)/300, -1, 1);
    ctx.strokeStyle = '#3b82f644';
    ctx.lineWidth = 1;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(sourceX, sourceY); ctx.stroke();
    ctx.setLineDash([]);

    // Source icon
    const sourceColor = draggingSource ? '#22c55e' : '#eab308';
    ctx.fillStyle = sourceColor;
    ctx.beginPath(); ctx.arc(sourceX, sourceY, 18, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff3';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sourceX, sourceY, 18, 0, Math.PI*2); ctx.stroke();
    // Speaker icon
    ctx.fillStyle = '#000';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SPK', sourceX, sourceY + 5);

    // Sound waves animation
    if (draggingSource) {
      const now = performance.now() / 300;
      for (let r = 0; r < 3; r++) {
        const radius = 25 + ((now + r * 0.8) % 3) * 25;
        const alpha = 1 - ((now + r * 0.8) % 3) / 3;
        ctx.strokeStyle = rgbStr(234, 179, 8, alpha * 0.5);
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(sourceX, sourceY, radius, 0, Math.PI*2); ctx.stroke();
      }
    }

    // Pan/distance info
    ctx.fillStyle = '#71717a';
    ctx.font = '11px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`Pan: ${pan.toFixed(2)} (L/R)`, 70, spY + 295);
    ctx.fillText(`Distance: ${distance.toFixed(0)}px`, 70, spY + 310);
    ctx.fillText(`Attenuation: ${clamp(1 - distance/300, 0, 1).toFixed(2)}`, 70, spY + 325);

    // Volume meters
    const mX = W - 200, mY = spY + 280;
    const barW = 50;
    ctx.fillStyle = '#71717a'; ctx.font = '10px monospace'; ctx.textAlign = 'right';
    ctx.fillText('Master', mX - 5, mY + 4); ctx.fillStyle = '#333'; ctx.fillRect(mX, mY - 5, barW, 8);
    ctx.fillStyle = '#3b82f6'; ctx.fillRect(mX, mY - 5, barW * masterVol, 8);
    ctx.fillStyle = '#71717a'; ctx.fillText('SFX', mX - 5, mY + 18); ctx.fillStyle = '#333'; ctx.fillRect(mX, mY + 9, barW, 8);
    ctx.fillStyle = '#22c55e'; ctx.fillRect(mX, mY + 9, barW * sfxVol, 8);
    ctx.fillStyle = '#71717a'; ctx.fillText('Music', mX - 5, mY + 32); ctx.fillStyle = '#333'; ctx.fillRect(mX, mY + 23, barW, 8);
    ctx.fillStyle = '#eab308'; ctx.fillRect(mX, mY + 23, barW * musicVol, 8);

    animFrame = requestAnimationFrame(draw);
  }

  draw();
  activeCleanup = () => {
    cancelAnimationFrame(animFrame); animFrame = null;
    stopSpatialTone();
    if (audioCtx) { audioCtx.close().catch(()=>{}); audioCtx = null; }
  };
}

  canvases.forEach(c => fitCanvas(c));
});
