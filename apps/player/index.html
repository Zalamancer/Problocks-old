<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problocks — Engine Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
    #canvas { width: 100vw; height: 100vh; display: block; }
    #ui {
      position: fixed; top: 16px; left: 16px;
      background: rgba(0,0,0,0.7); color: #fff;
      padding: 16px; border-radius: 8px;
      font-size: 14px; z-index: 10;
    }
    #ui h2 { margin-bottom: 8px; font-size: 16px; }
    #ui button {
      margin: 4px 4px 4px 0; padding: 6px 12px;
      background: #4444ff; color: white; border: none;
      border-radius: 4px; cursor: pointer; font-size: 13px;
    }
    #ui button:hover { background: #5555ff; }
    #ui p { margin-top: 8px; font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <h2>Problocks Engine Demo</h2>
    <button id="btn-box">Drop Box</button>
    <button id="btn-sphere">Drop Sphere</button>
    <button id="btn-cylinder">Drop Cylinder</button>
    <button id="btn-reset">Reset</button>
    <p>Click buttons to drop physics objects. Orbit with mouse.</p>
  </div>
  <script type="module" src="/src/sandbox-demo.ts"></script>
</body>
</html>
